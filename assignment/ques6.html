<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title><%= title %></title>
</head>
<body>
    <%- include('partials/header') %> <h1>Welcome to the Blog</h1>

    <section>
        <h2>Write a New Post</h2>
        <form action="/posts" method="POST">
            <input type="text" name="title" placeholder="Post Title" required><br><br>
            <textarea name="content" placeholder="Content" rows="5" required></textarea><br>
            <button type="submit">Publish Post</button>
        </form>
    </section>

    <hr>

    <section>
        <h2>Recent Posts</h2>
        <% posts.forEach(function(post) { %>
            <article>
                <h3><%= post.title %></h3>
                <p><%= post.content.substring(0, 100) %>...</p>
                <a href="/posts/<%= post.id %>">Read More</a> </article>
        <% }); %>
    </section>
</body>
</html>
